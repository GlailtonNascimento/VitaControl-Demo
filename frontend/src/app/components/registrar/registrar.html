<div class="login-container">
  <div class="login-card">
    <h2>VitaControl</h2>
    <p class="subtitle">Criar Nova Conta no Sistema</p>

    <div class="error-message" *ngIf="errorMessage && !emailError && !passwordError" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 1.2rem; text-align: center;">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 1.2rem; text-align: center;">
      {{ successMessage }}
    </div>

    <div class="login-fields">
      <div class="input-group" style="margin-bottom: 1.2rem;">
        <input 
          type="text" 
          name="email"
          [(ngModel)]="user.email" 
          placeholder="E-mail de Cadastro" 
          (input)="emailError = ''"
          (keyup.enter)="cadastrar()"
          [style.border]="emailError ? '1px solid red' : '1px solid #ccc'"
          style="width:100%; padding:10px; border-radius:4px; box-sizing: border-box;" />
        <span style="color: red; font-size: 0.8rem; display: block; margin-top: 4px;" *ngIf="emailError">{{ emailError }}</span>
      </div>

      <div class="input-group" style="margin-bottom: 1.2rem; position: relative;">
        <input 
          [type]="hidePassword ? 'password' : 'text'" 
          name="password"
          [(ngModel)]="user.password" 
          placeholder="Senha (mínimo 6 caracteres)" 
          (input)="passwordError = ''"
          (keyup.enter)="cadastrar()"
          [style.border]="passwordError ? '1px solid red' : '1px solid #ccc'"
          style="width:100%; padding:10px; padding-right: 40px; border-radius:4px; box-sizing: border-box;" />
        
        <span 
          (click)="hidePassword = !hidePassword" 
          style="position: absolute; right: 12px; top: 10px; cursor: pointer; user-select: none; font-size: 1.1rem;">
          {{ hidePassword ? '🔒' : '👁️' }}
        </span>
        
        <span style="color: red; font-size: 0.8rem; display: block; margin-top: 4px;" *ngIf="passwordError">{{ passwordError }}</span>
      </div>

      <button type="button" [disabled]="loading" (click)="cadastrar()" style="width:100%; padding:12px; background-color:#007bff; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">
        {{ loading ? 'Criando conta...' : 'Cadastrar' }}
      </button>
    </div>

    <a routerLink="/login" style="display:block; text-align:center; margin-top:15px; color:#007bff; text-decoration:none;">Já tem uma conta? Entrar</a>

    <footer style="margin-top:25px; font-size:0.8rem; text-align:center; color:#6c757d;">desenvolvedor: Glailton Nascimento</footer>
  </div>
</div>
