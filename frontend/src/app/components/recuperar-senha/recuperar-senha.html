<div class="login-container">
  <div class="login-card">
    <h2>Recuperar Senha</h2>
    <p class="subtitle">Digite seu e-mail cadastrado para receber as instruções</p>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <input type="email" [(ngModel)]="email" placeholder="E-mail" />

    <button (click)="enviarLink()" [disabled]="!email || loading">
      {{ loading ? 'Enviando...' : 'Enviar Link de Recuperação' }}
    </button>

    <a routerLink="/login" class="link">Voltar para o Login</a>

    <footer>desenvolvedor: Glailton Nascimento</footer>
  </div>
</div>
