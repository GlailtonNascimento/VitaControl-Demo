<div class="login-container">
  <div class="login-card">
    <h2>VitaControl</h2>
    <p class="subtitle">Recuperar Senha</p>

    <div class="error-message" *ngIf="message">
      {{ message }}
    </div>

    <input type="email" [(ngModel)]="email" placeholder="Digite seu e-mail cadastrado" />

    <button (click)="enviarLink()" [disabled]="loading">
      {{ loading ? 'Enviando...' : 'Enviar Link de Recuperação' }}
    </button>

    <div class="login-links" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px; align-items: center;">
      <a routerLink="/login" class="link">Voltar para Login</a>
    </div>

    <footer>desenvolvedor: Glailton Nascimento</footer>
  </div>
</div>
