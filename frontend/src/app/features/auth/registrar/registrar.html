<div class="login-container">
  <div class="login-card">
    <h2>Cadastro</h2>
    <p class="subtitle">VitaControl</p>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <input type="text" [(ngModel)]="user.username" placeholder="Usuário" />
    <div class="password-field">
      <input [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="user.password" placeholder="Senha" />
      <span class="eye-icon" (click)="hidePassword = !hidePassword">👁️</span>
    </div>

    <button (click)="cadastrar()" [disabled]="loading">{{ loading ? 'Cadastrando...' : 'Cadastrar' }}</button>
    <a routerLink="/auth/login" class="link">Voltar para Login</a>
    <footer>desenvolvedor: Glailton Nascimento</footer>
  </div>
</div>
