<div class="container">
  <div class="card">
    <h2>VitaControl</h2>
    <p>Criar Nova Conta no Sistema</p>

    <div *ngIf="mensagemErro" class="alert alert-danger">
      {{ mensagemErro }}
    </div>

    <form (ngSubmit)="cadastrar()">
      <div class="form-group">
        <input type="text" [(ngModel)]="usuario.nome" name="nome" placeholder="Nome Completo" required class="form-control">
      </div>

      <div class="form-group">
        <input type="email" [(ngModel)]="usuario.email" name="email" placeholder="E-mail" required class="form-control">
      </div>

      <div class="form-group password-container">
        <input type="password" [(ngModel)]="usuario.senha" name="senha" placeholder="Senha" required class="form-control">
      </div>

      <button type="submit" [disabled]="carregando" class="btn btn-primary">
        {{ carregando ? 'Criando conta...' : 'Cadastrar' }}
      </button>
    </form>

    <div class="links-container">
      <a routerLink="/login" class="link">Já tem uma conta? Entrar</a>
    </div>

    <div class="footer">
      <small>desenvolvedor: Glailton Nascimento</small>
    </div>
  </div>
</div>
