<div class="login-container">
  <div class="login-card">
    <h2>VitaControl</h2>
    <p class="subtitle">Acompanhamento de Pressão Arterial</p>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <input type="text" [(ngModel)]="usuario.username" placeholder="Usuário ou E-mail">

    <div class="password-field" style="position: relative; width: 100%;">
      <input [type]="hidePassword ? 'password' : 'text'"
             [(ngModel)]="usuario.password"
             placeholder="Senha"
             style="width: 100%; padding-right: 45px;">
      <span class="password-toggle-icon"
            (click)="hidePassword = !hidePassword"
            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 20px; user-select: none;">
        {{ hidePassword ? '🔒' : '👁️' }}
      </span>
    </div>

    <button (click)="login()" [disabled]="loading" style="margin-top: 20px; width: 100%;">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

    <div class="login-links" style="display: flex; flex-direction: column; gap: 8px; margin-top: 15px;">
      <a routerLink="/registrar" class="link">Criar conta</a>
      <a routerLink="/esqueci-senha" class="link">Esqueci a senha</a>
    </div>

    <footer style="margin-top: 20px; font-size: 12px; color: #888;">desenvolvedor: Glailton Nascimento</footer>
  </div>
</div>
