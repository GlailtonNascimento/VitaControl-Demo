<div class="login-container">
  <div class="login-card">
    <h2>VitaControl</h2>
    <p class="subtitle">Acompanhamento de Pressão Arterial</p>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <input type="text" [(ngModel)]="usuario.username" placeholder="Usuário ou E-mail" />

    <div class="password-field">
      <input [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="usuario.password" placeholder="Senha" />
      <span class="eye-icon" (click)="hidePassword = !hidePassword">👁️</span>
    </div>

    <button (click)="login()" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

    <a routerLink="/auth/registrar" class="link">Criar conta</a>

    <footer>desenvolvedor: Glailton Nascimento</footer>
  </div>
</div>
