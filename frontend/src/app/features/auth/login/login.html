<div class="login-container">
  <div class="login-card">
    <h2>VitaControl</h2>
    <p class="subtitle">Gerenciamento de Saúde Inteligente</p>
    
	<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="alert-error" *ngIf="mensagemErro">
        {{ mensagemErro }}
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Digite seu e-mail"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input 
          type="password" 
          id="senha" 
          formControlName="senha" 
          placeholder="Digite sua senha"
          [class.invalid]="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched"
        />
      </div>

      <button type="submit" [disabled]="loginForm.invalid || carregando">
        {{ carregando ? 'Autenticando...' : 'Entrar' }}
      </button>

    </form>

    <div class="auth-footer">
      <p>Não tem uma conta? <a routerLink="/auth/registrar">Cadastre-se aqui</a></p>
    </div>
	<div class="developer-footer">
   	<p class="subtitle">desenvolvedor: Glailton Nascimento</p>
    </div>
  </div>
</div>
