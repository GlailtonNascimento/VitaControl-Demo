
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vitacontrol}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=${PORT:8080}

# SendGrid
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}

# ***** SEGURANÇA *****
# CORS (permitir apenas frontend em desenvolvimento)
cors.allowed.origin=http://localhost:4200

# JWT - chave fixa com fallback para variável de ambiente
jwt.secret=${JWT_SECRET:VitaControl2024SuperSecretKey123!@#}
jwt.expiration=86400000

# Erros - não expor detalhes internos em produção
server.error.include-stacktrace=never
server.error.include-message=never
